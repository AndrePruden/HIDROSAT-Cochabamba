[workspace]
authors = ["aistari <301959373+odysstari@users.noreply.github.com>"]
channels = ['conda-forge']
name = "hackaton-cbba-early-warning"
platforms = ['linux-64']
version = "0.1.0"

[tasks]
parse-gamc = "python -m src.data_ingestion.gamc_parser"
fetch-meteo = "python -m src.data_ingestion.meteo_fetcher"
terrain-physics = "python -m src.physics.terrain_fabdem"
sar-physics = "python -m src.physics.sar_dielectric"
hydro-antecedent = "python -m src.physics.hydro_antecedent"
synthesize-hazards = "python -m src.physics.hazard_synthesizer"
validate = "python -m src.validation.scientific_audit"
figures = "python -m src.visualization.figures"
build-webgis = "python -m src.visualization.dashboard_builder"
serve = "python -m src.app.server"
test = "python -m unittest discover -s tests -v"

[dependencies]
python = ">=3.15.2,<3.16"
numpy = ">=2.5.4,<3"
pandas = ">=3.1.1,<4"
matplotlib = ">=3.11.2,<4"
requests = ">=2.34.2,<3"
folium = ">=0.20.0,<0.21"
shapely = ">=2.2.0,<3"
pillow = ">=13.0.0,<14"
pyproj = ">=3.8.0,<4"
scipy = ">=1.18.1,<2"
scikit-learn = ">=1.9.1,<2"
geopandas = ">=1.2.0,<2"
rasterio = ">=1.5.2,<2"
